# Copy this file to docmost-config.yml (in this same directory) and adjust.
# Never put the API token itself in here — it's read from an environment
# variable instead, so this file stays safe to commit.
#
#   cp .specify/extensions/docmost/docmost-config.template.yml \
#      .specify/extensions/docmost/docmost-config.yml

# Default base URL of your Docmost instance (no trailing slash).
# Only needed for the "docmost:<pageId>" shorthand — when you paste a full
# page URL, the base URL is read from that URL instead and this is ignored.
base_url: ""

# Name of the environment variable that holds your Docmost API token.
# Create the token in Docmost under Settings > API tokens, then:
#   export DOCMOST_API_TOKEN="<token>"
api_token_env: "DOCMOST_API_TOKEN"
