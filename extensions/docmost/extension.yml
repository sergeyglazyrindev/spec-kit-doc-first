schema_version: "1.0"

extension:
  id: docmost
  name: "Docmost Source Integration"
  version: "1.0.0"
  description: "Fetch content straight from a Docmost page for speckit.docsync.usespec to reconcile into spec.md, instead of a hand-copied paste"
  category: integration
  effect: read-only
  author: "Sergey Glazyrin"
  repository: https://github.com/sergeyglazyrindev/spec-kit-doc-first
  license: MIT
  homepage: https://github.com/sergeyglazyrindev/spec-kit-doc-first/tree/main/extensions/docmost

requires:
  speckit_version: ">=0.12.17"
  tools:
    - name: curl
      required: false
      description: "Used by the bash script variant to call the Docmost REST API"
    - name: jq
      required: false
      description: "Used by the bash script variant to build/parse JSON safely; falls back to python3 or a plain-text fallback when absent"
    - name: python3
      required: false
      description: "Used by the python script variant; also a fallback JSON parser for the bash variant"

provides:
  commands:
    - name: speckit.docmost.fetch
      file: commands/speckit.docmost.fetch.md
      description: "Fetch a Docmost page referenced in the input and output its content as Markdown"

  config:
    - name: "docmost-config.yml"
      template: "config-template.yml"
      description: "Docmost base URL default and the name of the env var holding the API token"
      required: false

hooks:
  before_usespec:
    command: speckit.docmost.fetch
    optional: false
    description: "Resolve a Docmost page URL (or docmost:<id> shorthand) given to speckit.docsync.usespec / speckit.docsync.refreshspec into Markdown content. Runs automatically when either command dispatches it; a no-op when the source has no Docmost reference."

tags:
  - "docmost"
  - "wiki"
  - "integration"
  - "source-of-truth"

config:
  defaults:
    base_url: ""
    api_token_env: "DOCMOST_API_TOKEN"
